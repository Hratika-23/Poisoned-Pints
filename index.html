<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poisoned Pints</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffc23d;--poison:#7cff4f;--ink:#1a0f2e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Nunito,system-ui,sans-serif;color:#fff;background:#140a2e}
/* ---- animated night sky ---- */
#sky{position:fixed;inset:0;background:linear-gradient(180deg,#0d0726 0%,#2a1460 45%,#7b3f8f 78%,#e0708a 100%);animation:dusk 14s ease-in-out infinite alternate}
@keyframes dusk{to{filter:hue-rotate(-18deg) brightness(1.08)}}
.star{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.6)}}
#moon{position:fixed;top:7%;right:9%;width:min(22vw,120px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe0,#ffe08a 60%,#f5c35a);
  box-shadow:0 0 60px 20px rgba(255,224,138,.35);animation:bob 6s ease-in-out infinite}
#moon:after{content:'';position:absolute;width:22%;height:22%;border-radius:50%;background:rgba(200,160,80,.35);top:30%;left:52%;box-shadow:-30px 18px 0 -2px rgba(200,160,80,.3)}
@keyframes bob{50%{transform:translateY(-8px)}}
/* town silhouette */
#town{position:fixed;left:0;right:0;bottom:0;height:34vh;min-height:190px;z-index:1}
#town svg{width:100%;height:100%;display:block}
.win{animation:flick 3s infinite}
.win:nth-child(3n){animation-delay:1.1s}.win:nth-child(4n){animation-delay:2s}
@keyframes flick{0%,100%{opacity:1}45%{opacity:.55}50%{opacity:1}75%{opacity:.8}}
.smoke{animation:smoke 4s linear infinite;opacity:0}
@keyframes smoke{0%{transform:translateY(0) scale(.6);opacity:.7}100%{transform:translateY(-60px) scale(1.6);opacity:0}}
/* floating things */
.float{position:fixed;z-index:1;bottom:-60px;opacity:.85;font-size:30px;animation:rise linear infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));pointer-events:none}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-115vh) rotate(360deg);opacity:0}}
.bubble{position:fixed;z-index:1;bottom:-20px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#e9ffd9,#7cff4f 60%,#3f9b22);opacity:.75;animation:rise linear infinite;pointer-events:none}
/* the sneaky spy */
#spy{position:fixed;z-index:2;bottom:calc(min(34vh,999px)*0.22);font-size:34px;animation:sneak 11s linear infinite;filter:drop-shadow(0 3px 0 rgba(0,0,0,.5))}
@keyframes sneak{0%{left:-50px;transform:scaleX(1)}45%{left:105vw;transform:scaleX(1)}50%{left:105vw;transform:scaleX(-1)}95%{left:-50px;transform:scaleX(-1)}100%{left:-50px}}
#guard{position:fixed;z-index:2;bottom:calc(min(34vh,999px)*0.22);font-size:34px;animation:sneak 11s linear infinite;animation-delay:-1.4s;filter:drop-shadow(0 3px 0 rgba(0,0,0,.5))}
/* content */
main{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 20px calc(24px + 18vh)}
h1{font-family:'Lilita One';font-weight:400;font-size:clamp(58px,16vw,110px);line-height:.86;margin:0;text-align:center;color:var(--poison);
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink),0 0 40px rgba(124,255,79,.5);animation:wob 3s ease-in-out infinite}
h1 span{display:block;color:var(--gold);text-shadow:0 7px 0 var(--ink),0 0 40px rgba(255,194,61,.5)}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(2deg) scale(1.04)}}
.mug{font-size:54px;animation:clink 1.6s ease-in-out infinite;display:inline-block}
@keyframes clink{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg) translateY(-6px)}}
p{font-weight:900;text-align:center;max-width:420px;margin:0;text-shadow:0 2px 0 var(--ink);font-size:17px}
a.play{display:block;width:min(340px,88vw);text-align:center;text-decoration:none;font-family:'Lilita One';font-size:34px;padding:16px;border-radius:22px;color:var(--ink);
  background:linear-gradient(180deg,#d9ffb8,var(--poison));box-shadow:0 8px 0 #3f9b22,0 0 0 0 rgba(124,255,79,.6);animation:glow 1.8s ease-in-out infinite;margin-top:6px}
a.play small{display:block;font-family:Nunito;font-size:14px;opacity:.8}
a.play:active{transform:translateY(5px);box-shadow:0 3px 0 #3f9b22}
@keyframes glow{50%{box-shadow:0 8px 0 #3f9b22,0 0 0 14px rgba(124,255,79,0)}}
.soon{width:min(340px,88vw);text-align:center;font-family:'Lilita One';font-size:20px;padding:12px;border-radius:18px;background:rgba(255,255,255,.12);border:2px dashed rgba(255,255,255,.35);color:#e9dcff}
.soon small{display:block;font-family:Nunito;font-size:13px;opacity:.85}
.tiny{font-size:12px;opacity:.75;font-weight:900;text-shadow:0 1px 0 var(--ink)}
</style>
</head>
<body>
<div id="sky"></div>
<div id="moon"></div>
<div id="town">
<svg viewBox="0 0 1000 300" preserveAspectRatio="xMidYMax slice">
  <g fill="#1d0f38">
    <rect x="0" y="210" width="1000" height="90"/>
    <polygon points="20,210 20,120 90,70 160,120 160,210"/><rect x="120" y="60" width="18" height="40"/>
    <polygon points="170,210 170,150 230,105 290,150 290,210"/>
    <polygon points="300,210 300,95 380,40 460,95 460,210"/><rect x="420" y="30" width="20" height="45"/>
    <polygon points="470,210 470,140 530,95 590,140 590,210"/>
    <polygon points="600,210 600,110 680,55 760,110 760,210"/><rect x="715" y="45" width="18" height="40"/>
    <polygon points="770,210 770,145 835,100 900,145 900,210"/>
    <polygon points="905,210 905,125 955,90 1005,125 1005,210"/>
  </g>
  <g fill="#ffd36b">
    <rect class="win" x="45" y="140" width="22" height="26" rx="3"/><rect class="win" x="105" y="140" width="22" height="26" rx="3"/>
    <rect class="win" x="215" y="160" width="20" height="24" rx="3"/>
    <rect class="win" x="330" y="120" width="26" height="30" rx="3"/><rect class="win" x="405" y="120" width="26" height="30" rx="3"/><rect class="win" x="368" y="165" width="26" height="30" rx="3"/>
    <rect class="win" x="515" y="155" width="20" height="24" rx="3"/>
    <rect class="win" x="630" y="135" width="24" height="28" rx="3"/><rect class="win" x="705" y="135" width="24" height="28" rx="3"/>
    <rect class="win" x="815" y="160" width="20" height="24" rx="3"/><rect class="win" x="940" y="150" width="20" height="24" rx="3"/>
  </g>
  <g fill="#7cff4f"><rect class="win" x="250" y="160" width="20" height="24" rx="3"/><rect class="win" x="850" y="160" width="20" height="24" rx="3"/></g>
  <g fill="rgba(230,220,255,.6)">
    <circle class="smoke" cx="129" cy="55" r="10"/><circle class="smoke" cx="430" cy="25" r="11" style="animation-delay:1.3s"/><circle class="smoke" cx="724" cy="40" r="10" style="animation-delay:2.4s"/>
  </g>
</svg>
</div>
<div id="spy">🥷</div><div id="guard">💂</div>
<main>
  <div class="mug">🍺</div>
  <h1>Poisoned<span>Pints</span></h1>
  <p>Run your tavern. Catch the spies.<br>Poison your rivals. Bribe the Guard. 😈</p>
  <a class="play" href="play/">▶ PLAY<small>7 days & nights vs rival taverns</small></a>
  <div class="soon">🌐 Play with friends<small>Multiplayer is coming soon</small></div>
  <div class="tiny">18+ · cartoon poisoning, brawls & betrayal</div>
</main>
<script>
// twinkling stars and floating bubbles / tavern things
const W = innerWidth, H = innerHeight;
for (let i=0;i<60;i++){ const s = document.createElement('div'); s.className = 'star'; s.style.left = Math.random()*100+'vw'; s.style.top = Math.random()*60+'vh';
  s.style.animationDelay = (Math.random()*2.4)+'s'; s.style.opacity = .4 + Math.random()*.6; document.body.appendChild(s); }
const things = ['🍺','🧪','💰','🗡️','🕵️','☠️','🪙','🍻','🎻','🔦'];
for (let i=0;i<14;i++){ const f = document.createElement('div'); f.className = 'float'; f.textContent = things[i % things.length];
  f.style.left = (Math.random()*92)+'vw'; f.style.animationDuration = (9 + Math.random()*9)+'s'; f.style.animationDelay = (-Math.random()*16)+'s'; f.style.fontSize = (22 + Math.random()*18)+'px'; document.body.appendChild(f); }
for (let i=0;i<18;i++){ const b = document.createElement('div'); b.className = 'bubble'; const s = 6 + Math.random()*16; b.style.width = b.style.height = s+'px';
  b.style.left = (Math.random()*100)+'vw'; b.style.animationDuration = (6 + Math.random()*8)+'s'; b.style.animationDelay = (-Math.random()*12)+'s'; document.body.appendChild(b); }
</script>
</body>
</html>
