<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Poisoned Pints</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffc23d;--poison:#7cff4f;--pink:#ff4d8d;--sky:#4cc9f0;--ink:#1a0f2e;--hdr:calc(58px + env(safe-area-inset-top));--ftr:calc(86px + env(safe-area-inset-bottom))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Nunito',system-ui,sans-serif;color:#fff;background:#2a1640}
button{font-family:inherit;color:inherit;border:0;cursor:pointer}
#c{position:fixed;left:0;right:0;top:var(--hdr);bottom:var(--ftr);width:100%;height:calc(100% - var(--hdr) - var(--ftr));display:block;
  background:radial-gradient(ellipse at 50% 40%,#5b3a7a,#2a1640 75%)}
body.night #c{background:radial-gradient(ellipse at 50% 40%,#2c2458,#0e0a24 75%)}

/* header + footer never overlap the scene */
#hdr{position:fixed;left:0;right:0;top:0;height:var(--hdr);padding:calc(8px + env(safe-area-inset-top)) 10px 8px;display:flex;align-items:center;gap:7px;
  background:linear-gradient(180deg,#3b2160,#2a1640);border-bottom:3px solid rgba(255,255,255,.08);z-index:5}
.chip{background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.14);border-radius:99px;padding:5px 11px;font-family:'Lilita One';font-size:18px;white-space:nowrap;line-height:1.1}
.ibtn{width:40px;height:40px;border-radius:13px;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.14);font-size:18px;flex:none}
#ftr{position:fixed;left:0;right:0;bottom:0;height:var(--ftr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1fr 1.35fr;gap:7px;
  background:linear-gradient(0deg,#3b2160,#2a1640);border-top:3px solid rgba(255,255,255,.08);z-index:5}
.fb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:16px;background:rgba(255,255,255,.1);font-weight:900;font-size:12px;position:relative;
  box-shadow:0 4px 0 rgba(0,0,0,.35)}
.fb .i{font-size:25px;line-height:1.05}
.fb.go{background:linear-gradient(180deg,#c8b8ff,#7b5cff);font-family:'Lilita One';font-size:17px;box-shadow:0 4px 0 #42288f}
.fb .dot{position:absolute;top:5px;right:12%;width:11px;height:11px;border-radius:50%;background:var(--pink);border:2px solid var(--ink)}
.fb:active{transform:translateY(3px)}
#nightBar{display:none;grid-column:1/-1;align-items:center;gap:10px;padding:0 6px}
body.night #nightBar{display:flex} body.night .fb{display:none}
#timeTrack{flex:1;height:18px;border-radius:9px;background:rgba(0,0,0,.4);overflow:hidden;border:2px solid rgba(255,255,255,.2)}
#timeFill{height:100%;width:100%;background:linear-gradient(90deg,#7b5cff,#c8b8ff)}

/* overlays inside the scene area */
#coach{position:fixed;left:50%;top:calc(var(--hdr) + 8px);transform:translateX(-50%);width:min(520px,94vw);background:#fff7e3;color:var(--ink);border-radius:16px;padding:8px 12px;
  font-weight:900;font-size:14px;box-shadow:0 4px 0 rgba(0,0,0,.25);display:flex;gap:9px;align-items:center;z-index:4;pointer-events:none;line-height:1.3}
#coach .av{font-size:24px}
#coach b{color:#b4462a}
#hand{position:fixed;font-size:40px;pointer-events:none;z-index:9;opacity:0;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35));transform:translate(-30%,-10%)}
#tip{position:fixed;pointer-events:none;z-index:8;transform:translate(-50%,-140%);background:var(--ink);border:3px solid #fff;border-radius:14px;padding:7px 12px;font-weight:900;font-size:15px;white-space:nowrap;opacity:0}
.bubble{position:fixed;z-index:6;transform:translate(-50%,-100%);background:#fff;color:var(--ink);border-radius:16px;padding:9px 12px;font-weight:900;font-size:14px;
  width:max-content;max-width:min(270px,84vw);box-shadow:0 5px 0 rgba(0,0,0,.25);line-height:1.3}
.bubble:after{content:'';position:absolute;left:50%;bottom:-11px;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tags span{background:#f1e8ff;border-radius:99px;padding:2px 8px;font-size:12px}
.acts{display:flex;gap:7px;margin-top:8px}
.pbtn{font-family:'Lilita One';font-size:16px;padding:8px 13px;border-radius:12px;background:linear-gradient(180deg,#fff27a,var(--gold));color:var(--ink);box-shadow:0 4px 0 #b4741a}
.pbtn.ghost{background:#e9e1f7;box-shadow:0 4px 0 #b7a9d1}
.pbtn.pink{background:linear-gradient(180deg,#ffb3c9,var(--pink));color:#fff;box-shadow:0 4px 0 #9b1f50}
.pbtn:disabled{opacity:.45}
.pop{position:fixed;z-index:7;pointer-events:none;font-family:'Lilita One';font-size:24px;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);
  transform:translate(-50%,-50%);animation:pop 1.5s ease-out forwards;white-space:nowrap}
@keyframes pop{0%{transform:translate(-50%,-30%) scale(.3);opacity:0}15%{transform:translate(-50%,-60%) scale(1.15);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-150%) scale(1);opacity:0}}
#banner{position:fixed;left:0;right:0;top:36%;text-align:center;font-family:'Lilita One';font-size:clamp(34px,10vw,60px);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;
  text-shadow:0 6px 0 var(--ink);pointer-events:none;opacity:0;transform:scale(.4);transition:all .3s cubic-bezier(.2,1.6,.4,1);z-index:10;padding:0 10px}
#banner.show{opacity:1;transform:scale(1)}
#banner small{display:block;font-family:Nunito;font-weight:900;font-size:17px;-webkit-text-stroke:0;text-shadow:0 2px 0 var(--ink)}
#alert{position:fixed;left:0;right:0;top:var(--hdr);bottom:var(--ftr);pointer-events:none;z-index:3;box-shadow:inset 0 0 0 0 rgba(255,60,60,0);transition:box-shadow .2s}
#alert.on{box-shadow:inset 0 0 40px 10px rgba(255,60,60,.7)}
#luck{position:fixed;right:14px;top:calc(var(--hdr) + 70px);z-index:8;display:none;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:12px;text-shadow:0 2px 0 var(--ink)}
#luck button{width:76px;height:76px;border-radius:50%;font-size:38px;background:radial-gradient(circle,#fff6a8,var(--gold));box-shadow:0 0 0 4px #fff,0 0 30px 8px rgba(255,194,61,.8);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}

/* sheets */
#sheetBg{position:fixed;inset:0;background:rgba(10,4,24,.55);z-index:20;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;max-height:78dvh;overflow:auto;touch-action:pan-y;background:#2f1a4d;border-top:3px solid rgba(255,255,255,.15);
  border-radius:22px 22px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));z-index:21;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,1,.3,1)}
#sheet.open{transform:none}
@media (min-width:760px){ #sheet{left:50%;right:auto;width:560px;margin-left:-280px} }
#sheet h2{font-family:'Lilita One';font-weight:400;font-size:25px;margin:0 0 8px;color:var(--gold);text-shadow:0 3px 0 var(--ink)}
.row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{font-family:'Lilita One';font-size:19px;padding:12px 20px;border-radius:16px;color:var(--ink);background:linear-gradient(180deg,#fff27a,var(--gold));box-shadow:0 5px 0 #b4741a}
.btn.green{background:linear-gradient(180deg,#c9ff9e,var(--poison));box-shadow:0 5px 0 #3f9b22}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.btn.pink{background:linear-gradient(180deg,#ffb3c9,var(--pink));color:#fff;box-shadow:0 5px 0 #9b1f50}
.item{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:rgba(255,255,255,.07);margin-bottom:7px}
.item .ic{font-size:30px;width:40px;text-align:center;flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:16px}
.item .tx small{display:block;font-size:13px;opacity:.8;font-weight:800;line-height:1.3}
.item .tx i{display:block;font-size:13px;color:#ffd98a;font-weight:800}
.item.out{opacity:.35} .item.out b{text-decoration:line-through}
.ch{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:900;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.13);margin:3px 3px 0 0}
.ch.hit{background:var(--poison);color:var(--ink)} .ch.bad{background:rgba(255,77,109,.3)} .ch.good{background:rgba(124,255,79,.22)}
.sec{font-weight:900;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.65;margin:12px 2px 6px}
.note{font-size:13px;opacity:.8;font-weight:800}
.clue{font-size:14px;font-weight:800;padding:7px 10px;border-radius:10px;background:rgba(0,0,0,.28);margin-top:5px;border-left:3px solid #b9a6ff}
.clue.sure{border-left-color:var(--poison)}
.big{font-family:'Lilita One';font-size:42px;text-align:center;color:var(--gold);text-shadow:0 3px 0 var(--ink)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:8px 0}
.trio div{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 4px;text-align:center;font-weight:800;font-size:12px}
.trio b{display:block;font-family:'Lilita One';font-weight:400;font-size:23px}
.rl{padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.07);margin-bottom:5px;font-size:14px;font-weight:800;border-left:4px solid #888;line-height:1.35}
.rl.good{border-left-color:var(--poison)} .rl.bad{border-left-color:var(--pink)} .rl.intel{border-left-color:#b9a6ff} .rl.news{border-left-color:var(--sky)}
.dotc{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid rgba(0,0,0,.4);vertical-align:-2px}

/* menu */
#menu{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;
  background:radial-gradient(ellipse at 50% 35%,#6b3fa0,#24123f 75%)}
.title{font-family:'Lilita One';font-size:clamp(54px,15vw,100px);line-height:.88;text-align:center;color:var(--poison);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;
  text-shadow:0 6px 0 var(--ink);transform:rotate(-3deg)}
.title span{display:block;color:var(--gold)}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--ink);padding:30px;text-align:center;font-weight:900;z-index:50}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="alert"></div>
<div id="hdr">
  <button class="ibtn" id="bMenu">☰</button>
  <div class="chip" id="hDay">☀️ DAY 1</div>
  <div style="flex:1"></div>
  <div class="chip" id="hGold">💰 250</div>
  <div class="chip" id="hRep">⭐ 50</div>
</div>
<div id="coach"><span class="av">🧔‍♀️</span><span id="coachT"></span></div>
<div id="ftr">
  <button class="fb" id="fHire"><span class="i">🚪</span>HIRE</button>
  <button class="fb" id="fBribe"><span class="i">🪙</span>BRIBE</button>
  <button class="fb" id="fClues"><span class="i">🔍</span>CLUES</button>
  <button class="fb go" id="fNight"><span class="i">🌙</span>OPEN UP</button>
  <div id="nightBar"><span class="chip" id="nServed">🍺 0</span><div id="timeTrack"><div id="timeFill"></div></div><span class="chip" id="nCaught">🕵️ 0</span></div>
</div>
<div id="hand">👆</div>
<div id="tip"></div>
<div id="bubbles"></div>
<div id="luck"><button id="luckBtn">⭐</button><span id="luckT">Tap for luck!</span></div>
<div id="banner"></div>
<div id="sheetBg"></div><div id="sheet"></div>
<div id="menu">
  <div class="title">Poisoned<span>Pints</span></div>
  <div style="font-weight:900;text-align:center;text-shadow:0 2px 0 var(--ink)">Run your tavern. Catch the spies.<br>Ruin your rivals. 😈</div>
  <button class="btn green" id="bStart" style="font-size:24px;padding:14px 34px">▶ PLAY</button>
  <div class="note">7 days & nights · 3 rival taverns · about 20 minutes</div>
</div>
<div id="err">The game didn't load. Check your connection and reload.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="engine.js"></script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
if (!window.THREE || !window.PP){ $('#err').style.display = 'flex'; return; }
const TAU = Math.PI*2, rand = (a,b) => a + Math.random()*(b-a), clamp = (v,a,b) => Math.max(a,Math.min(b,v)), lerp = (a,b,t) => a+(b-a)*t;
const pick = a => a[Math.floor(Math.random()*a.length)];
const wait = ms => new Promise(r => setTimeout(r, ms));
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// =====================================================================
// RENDERER — the canvas only fills the space between header and footer
// =====================================================================
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
const CAM = {pos:new THREE.Vector3(), look:new THREE.Vector3()};
let cRect = canvas.getBoundingClientRect();
function resize(){
  cRect = canvas.getBoundingClientRect(); const w = cRect.width, h = cRect.height, aspect = w/h;
  renderer.setSize(w, h, false); camera.aspect = aspect;
  // fit the 10-wide room in portrait, the whole room height in landscape
  if (aspect < 1){ camera.fov = clamp(2*Math.atan(Math.tan(Math.atan(5.35/16.6))/aspect)*180/Math.PI, 40, 74); CAM.pos.set(0.2, 15.6, 8.9); CAM.look.set(0, 0, -1.25); }
  else { camera.fov = 44; CAM.pos.set(0.3, 12.0, 11.6); CAM.look.set(0, 0, -0.4); }
  camera.updateProjectionMatrix(); camera.position.copy(CAM.pos); camera.lookAt(CAM.look);
}
addEventListener('resize', resize);

const hemi = new THREE.HemisphereLight(0xfff1dc, 0x6a4a8a, 0.72); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe2bd, 0.75); sun.position.set(-6, 14, 9); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera, {left:-9, right:9, top:9, bottom:-9, near:1, far:40}); sun.shadow.bias = -0.0005;
scene.add(sun);
const fireLight = new THREE.PointLight(0xff8a3a, 1.2, 9); fireLight.position.set(2.8, 1.6, -4.6); scene.add(fireLight);
const barLight = new THREE.PointLight(0xffc27a, 0.6, 8); barLight.position.set(-1.6, 2.8, -3.6); scene.add(barLight);
let night = 0, nightTarget = 0;

const grad = new THREE.DataTexture(new Uint8Array([140,140,140,255, 205,205,205,255, 255,255,255,255]), 3, 1, THREE.RGBAFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const MC = {}; const mat = (c, e) => MC[c+'|'+(e||0)] || (MC[c+'|'+(e||0)] = new THREE.MeshToonMaterial({color:c, gradientMap:grad, emissive:e||0}));
const OUT = new THREE.MeshBasicMaterial({color:0x1a0f2e, side:THREE.BackSide});
function mk(geo, c, o={}){ const m = new THREE.Mesh(geo, c && c.isMaterial ? c : mat(c)); m.castShadow = o.cast !== false; m.receiveShadow = !!o.recv;
  if (o.outline){ const ol = new THREE.Mesh(geo, OUT); ol.scale.setScalar(1 + o.outline); m.add(ol); } return m; }
const G = { sph:(r,w=16,h=12) => new THREE.SphereGeometry(r,w,h), cyl:(a,b,h,s=16) => new THREE.CylinderGeometry(a,b,h,s), box:(x,y,z) => new THREE.BoxGeometry(x,y,z) };
function emojiSprite(e, bg, size=0.8, ring){
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  if (bg){ g.fillStyle = bg; g.beginPath(); g.arc(64,64,56,0,TAU); g.fill(); g.lineWidth = ring ? 12 : 7; g.strokeStyle = ring || '#1a0f2e'; g.stroke(); }
  g.font = '64px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(e, 64, 70);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c), depthTest:false, transparent:true})); s.scale.set(size,size,1); s.renderOrder = 5; return s;
}
function setSpriteEmoji(s, e, bg, ring){ const n = emojiSprite(e, bg, 1, ring); s.material.map = n.material.map; s.material.needsUpdate = true; }

// =====================================================================
// CHUNKY CHARACTERS
// =====================================================================
const LOOKS = {
  poisoner:  {body:0x2f8f4e, skin:0xe6c29a, hat:'hood', hatC:0x1d5a31, prop:'vial'},
  pickpocket:{body:0x4a3f6b, skin:0xf0b98a, hat:'bandana', hatC:0x1d1730, prop:'dagger'},
  bruiser:   {body:0xb5452f, skin:0xc68642, wide:1.25, beard:0x4a2a14},
  spy:       {body:0x2a2d3a, skin:0xf5cfae, hat:'fedora', hatC:0x15161d, prop:'glass'},
  bard:      {body:0xe0701c, skin:0xf7d2b0, hat:'feather', hatC:0x7d3cb5, prop:'lute'},
  taster:    {body:0xf2f2f2, skin:0xffdcb8, hat:'chef', hatC:0xffffff, nose:1.9},
  talker:    {body:0x6a2c8a, skin:0xf1c27d, hat:'tophat', hatC:0x1a1a1a, prop:'cane'},
  waiter:    {body:0x1f6f8b, skin:0xf2c09b, hat:'cap', hatC:0x16495c, apron:true},
  cellarer:  {body:0x7a5230, skin:0xe0ac69, hat:'bandana', hatC:0x3b2412, wide:1.15, beard:0x6b4a2a},
  watchman:  {body:0x3a5a40, skin:0xf5cfae, hat:'fedora', hatC:0x22301f},
  cook:      {body:0xffffff, skin:0xf7d2b0, hat:'chef', hatC:0xffffff, apron:true, wide:1.2},
  owner:     {body:0xffc23d, skin:0xf5c6a0, hat:'crown', apron:true},
  hood:      {body:0x3d3848, skin:0x2c2838, hat:'hood', hatC:0x26222f, eyeGlow:true}
};
function makeChibi(o){
  const root = new THREE.Group(), rig = new THREE.Group(); root.add(rig);
  const W = o.wide || 1;
  const body = mk(G.cyl(0.42*W, 0.56*W, 0.8, 18), o.body, {outline:0.06}); body.position.y = 0.78; rig.add(body);
  const belly = mk(G.sph(0.5*W, 18, 12), o.body); belly.scale.set(1, 0.55, 1); belly.position.y = 0.42; rig.add(belly);
  if (o.apron){ const a = mk(G.box(0.62,0.62,0.06), 0xfaf3e6); a.position.set(0, 0.7, 0.5); a.rotation.x = -0.12; rig.add(a); }
  const head = new THREE.Group(); head.position.y = 1.68; rig.add(head);
  const skull = mk(G.sph(0.64, 24, 18), o.skin, {outline:0.05}); head.add(skull);
  const eyes = [], brows = [];
  for (const s of [-1,1]){
    const eye = mk(G.sph(0.17,14,10), o.eyeGlow ? mat(0xfff27a, 0xfff27a) : 0xffffff, {cast:false}); eye.scale.set(1, 1.15, 0.55); eye.position.set(0.23*s, 0.07, 0.55); head.add(eye); eyes.push(eye);
    if (!o.eyeGlow){ const p = mk(G.sph(0.095,10,8), 0x1a0f2e, {cast:false}); p.position.set(0.23*s, 0.06, 0.63); head.add(p);
      const hl = mk(G.sph(0.035,6,6), mat(0xffffff, 0xffffff), {cast:false}); hl.position.set(0.23*s+0.035, 0.11, 0.68); head.add(hl); }
    const brow = mk(G.box(0.26, 0.07, 0.07), 0x2a1a10, {cast:false}); brow.position.set(0.23*s, 0.31, 0.58); head.add(brow); brows.push(brow);
    const cheek = mk(G.sph(0.09,8,6), mat(0xff8fa8), {cast:false}); cheek.scale.set(1.3,0.8,0.4); cheek.position.set(0.38*s, -0.13, 0.5); head.add(cheek);
  }

const d2 = (a,b) => (a.x-b.x)**2 + (a.z-b.z)**2;
function nearestHub(p, skipOut){ let best = null, bd = 1e9; for (const k in HUB){ if (skipOut && k === 'OUT') continue; const d = d2(p, HUB[k]); if (d < bd){ bd = d; best = k; } } return best; }
function hubPath(a, b){ const prev = {[a]:null}, q = [a]; while (q.length){ const n = q.shift(); if (n === b) break; for (const m of EDGES[n]) if (!(m in prev)){ prev[m] = n; q.push(m); } }
  const out = []; let n = b; while (n){ out.unshift(n); n = prev[n]; } return out; }
function route(from, to, opt={}){
  const behindBar = p => p.z < -4.5 && p.x > -3.5 && p.x < 0.4;
  const pts = [];
  let a = nearestHub(from, from.x > -5), b = nearestHub(to, to.x > -5);
  if (behindBar(from)){ pts.push({x:0.9, z:-4.9}); a = 'C'; }
  const hp = hubPath(a, b).map(k => HUB[k]);
  hp.forEach(p => pts.push({x:p.x, z:p.z}));
  if (behindBar(to)) pts.push({x:0.9, z:-4.9});
  pts.push({x:to.x, z:to.z});
  // drop the first hub if we're already past it
  if (pts.length > 2 && d2(from, pts[1]) < d2(pts[0], pts[1]) && !behindBar(from)) pts.shift();
  return pts;
}

// ---------------- walkers ----------------
const walkers = new Set();
function walkTo(ch, pts, speed=3.2){ return new Promise(res => { [...walkers].forEach(w => { if (w.ch === ch){ walkers.delete(w); } }); ch.sit = false; walkers.add({ch, pts:pts.slice(), speed, res}); }); }
function updWalkers(dt){ for (const w of walkers){ const ch = w.ch, p = w.pts[0];
  if (!p){ walkers.delete(w); ch.spd = 0; w.res(); continue; }
  const dx = p.x-ch.pos.x, dz = p.z-ch.pos.z, d = Math.hypot(dx,dz);
  if (d < 0.06){ w.pts.shift(); continue; }
  const st = Math.min(d, w.speed*dt*(ch.slow||1)); ch.pos.x += dx/d*st; ch.pos.z += dz/d*st; ch.spd = w.speed; ch.face = Math.atan2(dx,dz); } }
const walking = ch => [...walkers].some(w => w.ch === ch);

// ---------------- particles / pops ----------------
const PG = {s:G.sph(0.11,6,5), b:G.box(0.18,0.18,0.18), c:G.cyl(0.12,0.12,0.04,10)}, BM = {};
const bmat = c => BM[c] || (BM[c] = new THREE.MeshBasicMaterial({color:c, transparent:true}));
const pool = []; for (let i=0;i<260;i++){ const m = new THREE.Mesh(PG.s, bmat(0xffffff)); m.visible = false; scene.add(m); pool.push({m, life:0}); }
function burst(p, color, n, o={}){ const {spd=3, up=4.5, life=0.8, geo='s', grav=12, size=1} = o;
  for (let i=0;i<n;i++){ const q = pool.find(q => q.life <= 0); if (!q) return; q.m.geometry = PG[geo]; q.m.material = bmat(color); q.m.visible = true; q.m.position.set(p.x, p.y||1, p.z);
    const a = Math.random()*TAU, s = rand(0.3,1)*spd; q.v = new THREE.Vector3(Math.cos(a)*s, rand(0.4,1)*up, Math.sin(a)*s); q.g = grav; q.life = q.max = life*rand(0.7,1.2); q.size = size*rand(0.7,1.3); } }
function updParticles(dt){ for (const q of pool){ if (q.life <= 0) continue; q.life -= dt; if (q.life <= 0){ q.m.visible = false; continue; }
  q.v.y -= q.g*dt; q.m.position.addScaledVector(q.v, dt); if (q.m.position.y < 0.06){ q.m.position.y = 0.06; q.v.y *= -0.4; q.v.x *= 0.7; q.v.z *= 0.7; }
  q.m.rotation.x += dt*6; q.m.scale.setScalar(q.size*Math.min(1, q.life/q.max*2)); } }
const _v = new THREE.Vector3();
function toScreen(p){ _v.set(p.x, p.y||0, p.z).project(camera); return {x:cRect.left + (_v.x*0.5+0.5)*cRect.width, y:cRect.top + (-_v.y*0.5+0.5)*cRect.height}; }
function pop(p, txt, color='#ffc23d'){ const s = toScreen(p), el = document.createElement('div'); el.className = 'pop';
  el.style.top = s.y+'px'; el.style.color = color; el.textContent = txt; document.body.appendChild(el);
  const w = el.offsetWidth; el.style.left = clamp(s.x, w/2 + 6, innerWidth - w/2 - 6)+'px'; setTimeout(() => el.remove(), 1600); }
let bannerT; function banner(t, color, small, dur=1.6){ const b = $('#banner'); b.innerHTML = `<span style="color:${color}">${t}</span>${small?`<small>${small}</small>`:''}`;
  b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); clearTimeout(bannerT); bannerT = setTimeout(() => b.classList.remove('show'), dur*1000); }

let actx = null; const audio = () => { if (!actx){ try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } if (actx && actx.state === 'suspended') actx.resume(); };
let muted = false;
function tone(f, d, type='square', v=0.06, f2=null, delay=0){ if (!actx || muted) return; const t = actx.currentTime+delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t+d); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t+d);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+0.02); }

function seedCrew(){

  [['Vex','poisoner','proud',4],['Pip','pickpocket','lucky',3],['Dunk','bruiser','sensitive',3],['Tansy','bard','gossip',4]].forEach(([name,type,quirk,loyalty]) => {

function slotPos(st){ const s = ST[st.station] || ST.rest, i = Math.max(0, stationSlot(st)); return s.slots[Math.min(i, s.slots.length-1)]; }
function syncStaff(instant){
  const p = me(), keep = new Set();
  p.staff.forEach(st => {
    keep.add(st.id); if (!st.station) st.station = 'rest';
    let ch = staffCh.get(st.id);
    if (!ch){ ch = makeChibi(LOOKS[st.type]); ch.data = st; const hit = new THREE.Mesh(G.cyl(0.8,0.8,2.6,10), new THREE.MeshBasicMaterial({visible:false})); hit.position.y = 1.2; ch.root.add(hit); ch.hit = hit; hit.userData.ch = ch;
      ch.badge = emojiSprite(STAFF[st.type].icon, '#ffffff', 0.62); ch.badge.position.set(0.7, 2.9, 0); ch.root.add(ch.badge);
      const door = HUB.OUT; ch.pos = instant ? {...slotPos(st)} : {x:door.x, z:door.z}; ch.root.position.set(ch.pos.x, 0, ch.pos.z); scene.add(ch.root); staffCh.set(st.id, ch); }
    setMood(ch, st.loyalty);
    ch.root.visible = !st.jailed;
    const m = p.plan.missions.find(x => x.staffId === st.id);
    const ring = m ? S.taverns[m.target].css : (st.exposed ? '#ff4d6d' : null);
    setSpriteEmoji(ch.badge, m ? MISSIONS[m.type].icon : STAFF[st.type].icon, '#ffffff', ring);
    if (!ch.dragging){ const goal = slotPos(st); const s = ST[st.station] || ST.rest;
      if (d2(ch.pos, goal) > 0.04 && !walking(ch)) walkTo(ch, route(ch.pos, goal), 4).then(() => { ch.face = s.face; ch.sit = st.station === 'rest' && ch.pos.z > 3.5; ch.work = st.station === 'bar'; });
      else if (!walking(ch)){ ch.face = s.face; ch.work = st.station === 'bar'; } }
  });
  for (const [id,ch] of staffCh){ if (!keep.has(id)){ scene.remove(ch.root); staffCh.delete(id); } }
}

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0,1,0), -0.9);
let drag = null;
function setRay(e){ ndc.set((e.clientX - cRect.left)/cRect.width*2-1, -((e.clientY - cRect.top)/cRect.height)*2+1); ray.setFromCamera(ndc, camera); }
function staffUnder(){ const hits = ray.intersectObjects([...staffCh.values()].filter(c => c.root.visible).map(c => c.hit), false); return hits.length ? hits[0].object.userData.ch : null; }
function zoneAt(p){ for (const k of ['bar','door','map']) if (ST[k].zone(p)) return k; return null; }
canvas.addEventListener('pointerdown', e => {
  audio(); setRay(e);
  if (phase === 'night'){ nightTap(e); return; }
  if (phase !== 'day') return;
  closeBubbles(); hideHand();
  const ch = staffUnder();
  if (ch && !walking(ch)){ drag = {ch, sx:e.clientX, sy:e.clientY, moved:false}; canvas.setPointerCapture(e.pointerId); return; }
  if (ray.intersectObject(ownerHit, false).length){ ownerTalk(); return; }
  const mh = ray.intersectObject(mapG, true); if (mh.length){ cityMap(); return; }
});
canvas.addEventListener('pointermove', e => {
  if (!drag || phase !== 'day') return; setRay(e);
  if (!drag.moved && Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) > 9){ drag.moved = true; drag.ch.dragging = true; drag.ch.sit = false; sfx.pick();
    ['bar','door','map'].forEach(k => { zoneMarks[k].icon.visible = true; }); }
  if (!drag.moved) return;
  const p = new THREE.Vector3(); ray.ray.intersectPlane(plane, p); const ch = drag.ch;
  ch.pos.x = clamp(p.x, -4.3, 4.3); ch.pos.z = clamp(p.z, -5.2, 4.4);
  const z = zoneAt(ch.pos); drag.zone = z;
  ['bar','door','map'].forEach(k => zoneMarks[k].ring.material.opacity = k === z ? 0.95 : 0.35);
  const tip = $('#tip'), st = ch.data;
  if (z){ tip.innerHTML = z === 'map' ? (STAFF[st.type].mission ? `🗺️ Send ${st.name} on a mission` : `${STAFF[st.type].name}s don't do missions`) : `${ST[z].icon} ${ST[z].name}: ${ST[z].desc}`; tip.style.opacity = 1; }
  else { tip.innerHTML = '💤 Rest'; tip.style.opacity = 0.8; }
  tip.style.left = e.clientX+'px'; tip.style.top = e.clientY+'px';
});
canvas.addEventListener('pointerup', e => {
  if (!drag) return; const d = drag; drag = null; $('#tip').style.opacity = 0;
  ['bar','door','map'].forEach(k => { zoneMarks[k].ring.material.opacity = 0; zoneMarks[k].icon.visible = false; });
  const ch = d.ch, st = ch.data; ch.dragging = false;
  if (!d.moved){ staffTalk(ch); return; }
  const z = d.zone;
  if (z === 'map'){ if (!STAFF[st.type].mission){ pop({x:ch.pos.x, y:3, z:ch.pos.z}, 'Not my job!', '#ff6b6b'); sfx.back(); syncStaff(); return; }
    if (st.quirk === 'proud' && st.loyalty <= 2){ pop({x:ch.pos.x, y:3, z:ch.pos.z}, '🦚 Hmph! No.', '#ff6b6b'); }
    missionPicker(st); return; }
  PP.clearMission(S, ME, st.id);
  if (z && me().staff.filter(y => y.station === z && y !== st).length >= ST[z].slots.length){ pop({x:ch.pos.x, y:3, z:ch.pos.z}, `${ST[z].name} is full!`, '#ff6b6b'); st.station = 'rest'; }
  else st.station = z || 'rest';
  sfx.drop(); ch.cheer = 0.5; syncStaff(); dayCoach();
});

const HOME_ROLE = {waiter:'bar', cellarer:'bar', cook:'bar', watchman:'door', taster:'bar'};
function defaultStation(st){ const want = HOME_ROLE[st.type] || 'rest'; if (want === 'rest') return 'rest';
  return me().staff.filter(y => y !== st && y.station === want).length < ST[want].slots.length ? want : 'rest'; }
const onDuty = type => me().staff.filter(s => s.type === type && !s.jailed && (s.station === 'bar' || s.station === 'door'));
function missionPicker(st){
  const mt = STAFF[st.type].mission, M = MISSIONS[mt];
  const targets = M.selfOnly ? [ME] : S.taverns.filter(t => t.id !== ME).map(t => t.id).concat(M.selfOk ? [ME] : []);
  let h = `<h2>${STAFF[st.type].icon} ${esc(st.name)}: ${M.name}</h2><div class="note">${M.desc}</div><div class="sec">Where to?</div>`;
  targets.forEach(id => { const t = S.taverns[id], risk = M.catch ? Math.round(PP.riskFor(S, ME, st, mt, id)*100) : 0, rev = id !== ME && PP.isRevenge(S, me(), id);
    h += `<div class="item" data-t="${id}" style="cursor:pointer"><div class="ic">${id===ME?'🏠':dotOf(id)}</div><div class="tx"><b>${id===ME?(mt==='spy'?'Our own tavern (find traitors)':'Our tavern'):esc(t.name)}</b>
      <small>${id===ME?'':`⭐ ${t.rep} · ${'💰'.repeat(PP.wealthTier(t.gold))} · `}${M.catch?`🚨 ${risk}% risk`:''}${rev?' · ⚔️ revenge':''}</small></div><div style="font-size:24px">›</div></div>`; });

  $('#sheetBg').onclick = () => { closeSheet(); st.station = st.station === 'map' && !me().plan.missions.find(m => m.staffId === st.id) ? 'rest' : st.station; syncStaff(); };
}
function staffTalk(ch){
  const st = ch.data, q = QUIRKS[st.quirk], m = me().plan.missions.find(x => x.staffId === st.id);
  const line = st.loyalty <= 2 ? SAD[st.quirk] : pick(LINES[st.quirk] || ['Ready, boss.']);

}

  if (unsolved.length && !p.accusedToday) return coach('Your clues point to <b>one rival</b>. Open <b>🔍 CLUES</b> and accuse them!');
  if (p.staff.some(s => s.exposed)) return coach('🐀 A <b>traitor</b> was exposed! Tap them and <b>Fire</b> them.');
  const grumpy = p.staff.find(s => s.loyalty <= 2); if (grumpy) return coach(`<b>${esc(grumpy.name)}</b> is unhappy. Give them a job: success cheers them up. Unhappy crew can be bought by rivals!`);

  coach('Plan done? Tap <b>🌙 OPEN UP</b>. Tap your armchair self 👑 to upgrade your ale.');
}

  for (const c of clueItems){ const s = toScreen({x:c.p.x, y:0.6, z:c.p.z}); if (Math.hypot(s.x - e.clientX, s.y - e.clientY) < 46){ collectClue(c); return; } }
  if (ray.intersectObject(kegG, true).length && N.kegEmpty){ refillKeg(); return; }
  if (N.brawl){ const bh = ray.intersectObjects(N.brawl.map(g => g.hit), false); if (bh.length){ breakBrawl(); return; } }
  const gh = ray.intersectObjects(guests.filter(g => g.state === 'wait').map(g => g.hit), false);
  if (gh.length){ serve(gh[0].object.userData.g, false); return; }
}
function collectClue(c){ scene.remove(c.s); scene.remove(c.glow); clueItems.splice(clueItems.indexOf(c),1); N.clues[c.e.id] = (N.clues[c.e.id]||0) + 1; sfx.clue();
  burst({x:c.p.x, y:0.8, z:c.p.z}, 0xfff27a, 10, {up:3}); pop({x:c.p.x, y:2, z:c.p.z}, '🔍 Clue!', '#fff27a'); }
function refillKeg(){ N.kegEmpty = false; kegG.children[0].scale.y = 1; pop({x:-4, y:2.6, z:-4.8}, '🍺 Refilled!', '#ffc23d'); sfx.coin(); if (kegG.userData.sign){ kegG.remove(kegG.userData.sign); kegG.userData.sign = null; } }
function startBrawl(){ const seated = guests.filter(g => g.state === 'wait' || g.state === 'drink'); if (seated.length < 2) return;
  N.brawl = seated.slice(0,2); N.brawlT = 6; N.brawl.forEach(g => { g.sit = false; g.state = 'fight'; g.bub.visible = true; setSpriteEmoji(g.bub, '😠', '#ffc9d3'); setMood(g, 1); });
  sfx.hit(); coach('🥊 Two guests are fighting! <b>Tap them</b> to break it up before chairs fly!'); }
function breakBrawl(){ N.brawl.forEach(g => { g.state = 'wait'; g.sit = true; g.patience = Math.max(6, g.patience); setSpriteEmoji(g.bub, '🍺', '#ffffff'); setMood(g, 3); });
  pop({x:N.brawl[0].pos.x, y:3, z:N.brawl[0].pos.z}, '✋ Calm down!', '#7cff4f'); N.brawl = null; sfx.catch(); }
function showLuck(e){ e.shown = true; const st = me().staff.find(s => s.id === e.staffId);
  const el = $('#luck'); $('#luckT').innerHTML = `${STAFF[e.staffType].icon} ${esc(e.staffName)} → ${esc(tname(e.target))}<br>Tap for luck!`; el.style.display = 'flex';
  N.luck = {e, t:2.6}; coach(`${STAFF[e.staffType].icon} <b>${esc(e.staffName)}</b> is sneaking into <b>${esc(tname(e.target))}</b>… tap the ⭐ to help!`); }
$('#luckBtn').onclick = () => { if (!N || !N.luck) return; const e = N.luck.e; if (MISSIONS[e.type].catch) e.caught = false; e.lucky = true; N.luck = null; $('#luck').style.display = 'none';
  sfx.win(); banner('LUCKY!', '#ffc23d', `${e.staffName} slips past the guards`, 1.2); };

function updNight(dt){
  const n = N; n.t += dt; $('#timeFill').style.width = (100*(1 - n.t/NIGHT_LEN))+'%'; $('#nServed').textContent = '🍺 ' + n.served; $('#nCaught').textContent = '🕵️ ' + n.caught;
  // guests arrive
  n.spawn -= dt * (n.poisoned ? 0.5 : 1);
  if (n.spawn <= 0 && n.t < NIGHT_LEN - 8){ spawnGuest(); n.spawn = rand(2.2, 3.6) * (60/(40 + me().rep*0.5 + me().ale*6)); }
  guests.forEach(g => { if (g.state !== 'wait') return; g.patience -= dt; const f = g.patience/g.max;
    if (f < 0.5 && !g.warn){ g.warn = 1; setSpriteEmoji(g.bub, '🍺', '#ffc23d'); } if (f < 0.25 && g.warn === 1){ g.warn = 2; setSpriteEmoji(g.bub, '🍺', '#ff6b6b'); setMood(g, 2); }
    g.bub.scale.setScalar(0.85 + (f < 0.25 ? Math.sin(n.t*14)*0.1 : 0));
    if (g.patience <= 0){ n.missed++; guestLeave(g, 'angry'); } });
  // bar staff serve on their own (slower than you)
  const barStaff = me().staff.filter(s => s.station === 'bar' && !s.jailed).length;
  if (barStaff){ n.barCd -= dt * barStaff; if (n.barCd <= 0){ n.barCd = 4.2; const g = guests.filter(g => g.state === 'wait').sort((a,b) => a.patience - b.patience)[0]; if (g) serve(g, true); } }
  // waiters walk the floor and serve on their own
  onDuty('waiter').forEach(s => { const ch = staffCh.get(s.id); if (!ch || ch.busy || walking(ch)) return;
    ch.wcd = (ch.wcd || 0) - dt; if (ch.wcd > 0) return;
    const g = guests.filter(g => g.state === 'wait' && !g.claimed).sort((a,b) => a.patience - b.patience)[0]; if (!g) return;
    g.claimed = true; ch.busy = true; ch.work = false;
    walkTo(ch, route(ch.pos, {x:g.pos.x + (g.seat && g.seat.x < g.pos.x ? -0.8 : 0.8), z:g.pos.z + 0.7}), 4.6).then(() => {
      if (g.state === 'wait') serve(g, ch); g.claimed = false; ch.cheer = 0.3; ch.wcd = 1.2;
      walkTo(ch, route(ch.pos, slotPos(s)), 4.6).then(() => { ch.busy = false; ch.face = 0; }); }); });
  // keg runs dry now and then
  if (!n.kegEmpty && n.t > n.nextDry){ n.kegEmpty = true; n.nextDry = n.t + rand(20,30); const s = emojiSprite('🚫', '#ffffff', 1); s.position.y = 2.4; kegG.add(s); kegG.userData.sign = s;
    const cel = onDuty('cellarer').length; n.dryT = cel ? 1.2 : barStaff ? 6 : 999;
    if (cel) pop({x:-4, y:3, z:-4.6}, '🛢️ On it!', '#ffc23d'); else { coach('🍺 The <b>keg is empty</b>! Tap the keg to refill it. (A 🛢️ <b>Cellar-keeper</b> would do it for you.)'); sfx.alarm(); } }
  if (n.kegEmpty && n.dryT < 900){ n.dryT -= dt; if (n.dryT <= 0){ refillKeg(); } }
  // guest brawl
  if (!n.brawl && n.t > n.nextBrawl){ n.nextBrawl = n.t + rand(25,40); startBrawl(); }
  if (n.brawl){ n.brawlT -= dt; n.brawl.forEach((g,i) => { g.face = Math.atan2(n.brawl[1-i].pos.x - g.pos.x, n.brawl[1-i].pos.z - g.pos.z); g.cheer = 0.2; });
    if (n.brawlT <= 0){ const b = n.brawl; n.brawl = null; shake = 0.4; sfx.hit(); burst({x:b[0].pos.x, y:1, z:b[0].pos.z}, 0x9c6634, 18, {geo:'b', spd:5});
      b.forEach(g => guestLeave(g, 'angry')); me().rep = Math.max(0, me().rep - 2); pop({x:b[0].pos.x, y:3, z:b[0].pos.z}, '−2 ⭐', '#ff6b6b'); hud(); } }
  // intruders arrive on schedule; door guards may grab them
  n.vsMe.forEach(e => { if (e.live === 'pending' && n.t >= e.at) spawnIntruder(e); });
  intruders.forEach(ch => { if (ch.e.live !== 'in') return; ch.alertS.position.y = 3.0 + Math.sin(n.t*10)*0.15;
    me().staff.filter(s => s.station === 'door' && !s.jailed).forEach(s => { const g = staffCh.get(s.id); if (!g || ch.guardTried.has(s.id)) return;
      if (d2(g.pos, ch.pos) < 2.6){ ch.guardTried.add(s.id); const chance = (s.type === 'bruiser' ? 0.6 : s.type === 'watchman' ? 0.35 : 0.4) + onDuty('watchman').length*0.12;
        if (Math.random() < chance){ g.cheer = 1; catchIntruder(ch, s.name); } else pop({x:g.pos.x, y:3, z:g.pos.z}, 'Missed!', '#ffffff'); } }); });
  // my agents: a lucky-tap moment for each
  n.mine.forEach(e => { if (!e.shown && n.t >= e.at && !n.luck) showLuck(e); });
  if (n.luck){ n.luck.t -= dt; if (n.luck.t <= 0){ n.luck = null; $('#luck').style.display = 'none'; } }
  // clues fade
  for (let i=clueItems.length-1;i>=0;i--){ const c = clueItems[i]; c.life -= dt; c.glow.material.opacity = 0.5 + Math.sin(n.t*8)*0.3; c.s.position.y = 0.6 + Math.sin(n.t*4 + i)*0.1;
    if (c.life <= 0){ scene.remove(c.s); scene.remove(c.glow); clueItems.splice(i,1); } }
  if (n.t >= NIGHT_LEN) endNight();
}
async function endNight(){
  const n = N; phase = 'dawn'; $('#luck').style.display = 'none';
  // intruders still on their way never finished the job: the engine counts them as escaped attempts
  n.vsMe.forEach(e => { if (e.live === 'pending' || e.live === 'in'){ e.caught = false; e.fizzledLive = true; } });
  intruders.slice().forEach(ch => { scene.remove(ch.root); }); intruders.length = 0;
  clueItems.forEach(c => { scene.remove(c.s); scene.remove(c.glow); }); clueItems.length = 0;
  coach('🌅 Last orders! Everyone heads home…'); guests.slice().forEach(g => { if (g.state === 'wait' || g.state === 'drink' || g.state === 'fight') guestLeave(g, g.state === 'drink' ? 'happy' : 'angry'); });
  doorPivot.rotation.y = 0; nightTarget = 0; document.body.classList.remove('night'); sfx.rooster();
  staffCh.forEach(ch => { ch.busy = false; ch.wcd = 0; });
  await wait(1200);
  // engine resolution
  const p = me();
  p.staff.forEach(s => { if (s.station === 'bar' || s.station === 'door') s.idle = -1; });     // working staff aren't idle
  n.vsMe.forEach(e => { if (e.fizzledLive){ e.refused = false; e.slept = true; } });            // never reached the target
  const before = p.gold;
  const res = PP.applyNight(S, n.roll);
  // replace the engine's crowd estimate with what you actually earned live
  const r = res.perTavern[ME]; p.gold += n.income - r.income; r.income = n.income; r.served = n.served; p.rep = clamp(p.rep - Math.floor(n.missed/2), 0, 100);
  // keep only the clues you actually picked up
  r.newIncidents.forEach(id => { const inc = p.incidents.find(i => i.id === id); const ev = n.vsMe.find(e => e.by === inc.culprit && e.type === inc.type && n.clues[e.id] !== undefined);
    const got = ev ? n.clues[ev.id] : 0; const traits = inc.clues.filter(c => c.kind === 'trait'), extra = inc.clues.filter(c => c.kind !== 'trait' && c.kind !== 'none');
    inc.clues = [...traits.slice(0, got), ...extra]; if (!inc.clues.length) inc.clues = [{kind:'none', text:'You didn\'t pick up any clues.', points:null, icon:'🌫️'}]; });
  kegMat.emissive.setRGB(0,0,0); if (N.kegEmpty) refillKeg();
  morning(res, n);
}

// =====================================================================
// MORNING
// =====================================================================
function morning(res, n){
  const r = res.perTavern[ME], p = me();
  const lines = c => r.msgs.filter(m => m.cat === c).map(m => `<div class="rl ${m.kind}">${esc(m.text)}</div>`).join('');
  let h = `<h2 style="text-align:center">🌅 Morning after night ${S.over ? S.maxDays : S.day-1}</h2>
    <div class="trio"><div><b>${n.served}</b>guests served</div><div><b style="color:var(--poison)">+${n.income}</b>earned</div><div><b style="color:var(--pink)">−${r.wages}</b>crew pay & rent</div></div>
    <details class="rl" style="border-left-color:#ffc23d"><summary style="cursor:pointer"><b>${n.income - r.wages >= 0 ? '📈 Profit' : '📉 Loss'} tonight: ${n.income - r.wages >= 0 ? '+' : ''}${n.income - r.wages} gold</b> <span style="opacity:.7">(tap to see who got paid)</span></summary>
      <div style="margin-top:6px;font-size:13px;line-height:1.6">${p.staff.filter(s => !s.jailed).map(s => `${STAFF[s.type].icon} ${esc(s.name)}: ${s.wage}g`).join('<br>')}<br>🏠 Tavern rent: 10g<br>
      <span style="opacity:.75">Every night you pay each crew member their wage, plus rent. Serve more guests to earn more than you pay!</span></div></details>
    <div class="trio"><div><b>${n.caught}</b>spies caught</div><div><b>${n.escaped}</b>got away</div><div><b>${n.missed}</b>angry guests</div></div>`;
  const you = lines('you'); if (you) h += `<div class="sec">At your tavern</div>${you}`;
  if (r.newIncidents.length){ r.newIncidents.forEach(id => { const inc = p.incidents.find(i => i.id === id), cand = PP.candidates(S, ME, inc);
    h += `<div class="rl bad">${MISSIONS[inc.type].icon} Clues collected: ${inc.clues.filter(c=>c.kind!=='none').length}. ${cand.length===1?`🎯 Only <b>${esc(tname(cand[0]))}</b> matches!`:`🔎 ${cand.length} rivals still match.`}</div>`; });
    h += `<div class="note">Open 🔍 CLUES to accuse.</div>`; }
  const mis = lines('mission'); if (mis) h += `<div class="sec">Your missions</div>${mis}`;
  const crew = lines('crew'); if (crew) h += `<div class="sec">Your crew</div>${crew}`;
  const intel = lines('intel'); if (intel) h += `<div class="sec">Secret intel</div>${intel}`;
  const town = [...r.msgs.filter(m => m.cat === 'news').map(m => m.text), ...res.news]; if (town.length) h += `<div class="sec">Talk of the town</div>` + town.map(t => `<div class="rl news">${esc(t)}</div>`).join('');
  h += `<div class="row"><button class="btn green" id="goDay">${S.over ? '🏆 Final results' : `☀️ Start day ${S.day}`}</button></div>`;
  sheet(h); $('#sheet').dataset.lock = '1'; $('#sheetBg').onclick = null;
  $('#goDay').onclick = () => { delete $('#sheet').dataset.lock; closeSheet(); $('#sheetBg').onclick = () => { if (!$('#sheet').dataset.lock) closeSheet(); }; if (S.over) endGame(); else startDay(); };
}
function startDay(){
  phase = 'day'; N = null;
  S.taverns.forEach(t => { if (t.isBot) PP.botDay(S, t.id); });
  me().staff.forEach(s => { const ch = staffCh.get(s.id); if (ch && !ch.root.visible && !s.jailed){ ch.pos = {...HUB.OUT}; ch.root.position.set(ch.pos.x, 0, ch.pos.z); }
    if (!s.station || s.station === 'map') s.station = 'rest'; });
  syncStaff(); hud();
  banner(`DAY ${S.day}`, '#ffc23d', S.day === S.maxDays ? 'The final day!' : 'Plan your moves', 1.4);
  const inbox = me().inbox.splice(0); if (inbox.length) setTimeout(() => pop({x:0, y:3, z:0}, inbox[0].text.slice(0, 40) + '…', '#ffffff'), 1500);
  dayCoach();
}
function endGame(){
  phase = 'end'; const rank = PP.ranking(S), pos = rank.findIndex(t => t.id === ME) + 1;
  if (pos === 1){ sfx.win(); owner.cheer = 5; }
  const hits = []; S.history.forEach(nn => nn.events.forEach(e => { if (e.target === ME && e.by !== ME && MISSIONS[e.type].harm) hits.push(`Night ${nn.day}: ${tname(e.by)} tried to ${MISSIONS[e.type].name.toLowerCase()} you.`); }));
  const moles = me().staff.filter(s => s.moleFor !== null).map(s => `${s.name} was secretly working for ${tname(s.moleFor)}!`);
  sheet(`<h2 style="text-align:center;font-size:32px">${pos===1?'🏆 YOU RULE ASHVEIL!':pos===2?'🥈 So close!':'🍺 Last orders…'}</h2>
    ${rank.map((t,i) => `<div class="item" style="${t.id===ME?'outline:2px solid var(--gold)':''}"><div class="ic" style="font-family:Lilita One">${i+1}</div><div class="tx"><b>${dotOf(t.id)} ${t.id===ME?'You':esc(t.name)}</b><small>💰 ${t.gold} · ⭐ ${t.rep}${t.isBot?` · ${PP.PERS[t.pers].label}`:''}</small></div><b style="font-family:Lilita One;font-size:20px;color:var(--gold)">${PP.score(t)}</b></div>`).join('')}
    <div class="sec">🕵️ The truth revealed</div>${[...moles.map(t=>`<div class="rl bad">🐀 ${esc(t)}</div>`), ...hits.map(t=>`<div class="rl">${esc(t)}</div>`)].join('') || '<div class="rl">Nobody touched your tavern. Suspicious…</div>'}
    <div class="row"><button class="btn green" id="again">PLAY AGAIN</button></div>`);
  $('#sheet').dataset.lock = '1'; $('#again').onclick = () => location.reload();
}

// =====================================================================
// START
// =====================================================================
$('#fNight').onclick = () => {
  if (phase !== 'day') return; audio();
  const p = me(), idle = p.staff.filter(s => s.station === 'rest' && !s.jailed);
  if (S.day === 1 && !p.plan.missions.length){ coach('First, drag a crew member onto the <b>🗺️ map</b> to send them on a mission!'); dayCoach(); return; }
  startNight();
};
function ensureFirstSpy(){
  // on the first night, make sure one rival sends a spy so you can learn to catch them
  const attacks = S.taverns.filter(t => t.isBot).some(t => t.plan.missions.some(m => m.target === ME && MISSIONS[m.type].harm));
  if (attacks) return;
  const t = S.taverns[2] || S.taverns[1];
  let st = t.staff.find(x => x.type === 'pickpocket' && !x.jailed);
  if (!st){ st = {id:S.nextId++, type:'pickpocket', name:'Snitch', quirk:'clumsy', cost:40, wage:10, loyalty:3, moleFor:null, born:false, turned:false, note:'', tell:false, jailed:0, exposed:false, idle:0, wins:0}; t.staff.push(st); }
  PP.setMission(S, t.id, {staffId:st.id, type:'steal', target:ME});
}
function newGame(){
  S = PP.createGame({rivals:3, difficulty:'normal'}); seedCrew();
  S.taverns.forEach(t => { if (t.isBot) PP.botDay(S, t.id); }); ensureFirstSpy();
  syncStaff(true); phase = 'day'; hud();
  banner('DAY 1', '#ffc23d', 'Welcome to your tavern, boss!', 1.6); dayCoach();
}
$('#bStart').onclick = () => { audio(); $('#menu').style.display = 'none'; newGame(); };

// =====================================================================
// LOOP
// =====================================================================
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  updWalkers(dt);
  if (phase === 'night' && N) updNight(dt);
  const all = [...staffCh.values(), ...guests, ...intruders, owner];
  all.forEach(ch => {
    if (!walking(ch) && !ch.dragging) ch.spd = 0;
    const y = ch.dragging ? 1.0 + Math.sin(ch.t*5)*0.1 : ch === owner ? 0.38 : (ch.sit && ch !== owner ? 0.42 : 0);
    ch.root.position.x += (ch.pos.x - ch.root.position.x) * Math.min(1, dt*25);
    ch.root.position.z += (ch.pos.z - ch.root.position.z) * Math.min(1, dt*25);
    ch.root.position.y += (y - ch.root.position.y) * Math.min(1, dt*12);
    let df = (ch.dragging ? 0 : ch.face) - ch.root.rotation.y; df = Math.atan2(Math.sin(df), Math.cos(df)); ch.root.rotation.y += df*Math.min(1, dt*10);
    anim(ch, dt);
  });
  // fire flicker + night light
  fire.scale.y = 1 + Math.sin(now/90)*0.15; fire2.scale.y = 1 + Math.cos(now/70)*0.2; fireLight.intensity = 1.1 + Math.sin(now/80)*0.25 + night*0.8;
  night += (nightTarget - night) * Math.min(1, dt*1.5);
  sun.intensity = lerp(0.75, 0.18, night); hemi.intensity = lerp(0.72, 0.38, night); barLight.intensity = 0.6 + night*0.9;
  winM.emissive.setRGB(lerp(0.35,0.05,night), lerp(0.55,0.08,night), lerp(0.7,0.25,night));
  lanterns.forEach(l => l.material.emissive.setRGB(0.25 + night*0.8, 0.18 + night*0.55, night*0.2));
  if (!N || !N.poisoned) kegMat.emissive.setRGB(0,0,0);
  camera.position.copy(CAM.pos); if (shake > 0){ camera.position.x += rand(-1,1)*shake; camera.position.y += rand(-1,1)*shake; shake = Math.max(0, shake - dt*2); }
  camera.lookAt(CAM.look);
  bubbles.forEach(placeBubble); updHand(dt); updParticles(dt);
  renderer.render(scene, camera);
}
resize(); requestAnimationFrame(frame);
window.__pp = {get S(){return S;}, get N(){return N;}, get phase(){return phase;}, staffCh, guests, intruders, clueItems, toScreen, newGame, startNight, endNight,
  serve, catchIntruder, collectClue, ST, syncStaff, missionPicker};
})();
</script>
